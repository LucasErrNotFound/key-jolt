  <title>KeyJolt — joystick keycap</title>
  <desc>A deliberately scruffy doodle of a three-dimensional warm gray keycap with a centered uppercase K turned counter-clockwise on its top surface. A crooked joystick overlaps the letter and holds a lumpy red ball. Wobbly doubled outlines and scattered small, medium, and moderately large scratches cover the keycap. Transparent background.</desc>
