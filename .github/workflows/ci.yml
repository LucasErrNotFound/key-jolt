name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libasound2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libappindicator3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
